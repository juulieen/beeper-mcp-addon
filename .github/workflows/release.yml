# On a version tag (v0.2.0…): publish to npm with trusted publishing (no npm token stored
# anywhere, provenance attached) and attach the Claude Desktop bundle to a GitHub release.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run build
      - name: Publish to npm (skipped if this version is already published)
        run: |
          if npm view "beeper-mcp-addon@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "Already on npm, skipping."
          else
            npm publish --provenance --access public
          fi
      - run: npm run bundle
      - name: Attach the .mcpb to the GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" beeper-mcp-addon.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
