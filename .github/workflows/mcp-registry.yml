# Publish server.json to the official MCP registry, authenticated as this repository via
# GitHub OIDC (no stored token). Runs after the npm release, or by hand.
name: mcp-registry
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install mcp-publisher (checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$PUBLISHER_VERSION" -R modelcontextprotocol/registry \
            -p mcp-publisher_linux_amd64.tar.gz -p "registry_${PUBLISHER_VERSION#v}_checksums.txt"
          grep ' mcp-publisher_linux_amd64.tar.gz$' "registry_${PUBLISHER_VERSION#v}_checksums.txt" | sha256sum -c
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Wait until this version is on npm
        run: |
          v=$(node -p 'require("./package.json").version')
          for i in $(seq 30); do npm view "beeper-mcp-addon@$v" version && exit 0; sleep 20; done; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
